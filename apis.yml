name: Mina Protocol
description: >-
  Mina Protocol is a lightweight, layer-1 blockchain powered by zero-knowledge
  proofs (zk-SNARKs) that maintains a constant ~22KB chain size regardless of
  usage, using the Ouroboros Samasika proof-of-stake consensus. Developers build
  privacy-preserving smart contracts called zkApps in TypeScript with the o1js
  framework, sign transactions with mina-signer, scaffold and deploy projects
  with the zkApp CLI, and integrate with the network through the Mina daemon's
  native GraphQL API and a first-party Coinbase Rosetta API implementation for
  exchanges and data indexing. Originally surfaced as a portfolio company of
  Multicoin Capital and enriched here from Mina's public developer surface.
